<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Formentera Operations Intelligence</title>
  <style>
    :root {
      /* Formentera brand colors */
      --fp-navy: #001F45;
      --fp-dark-slate: #3D4F5F;
      --fp-teal: #3D8B7A;
      --fp-purple: #553D8C;
      --fp-crimson: #A3192B;
      --fp-green: #6AAD4E;
      --fp-steel: #336699;

      /* Neutrals */
      --fp-black: #000000;
      --fp-white: #FFFFFF;
      --fp-light-gray: #E6E6E6;
      --fp-gray: #7F7F7F;
      --fp-off-white: #F2F2F2;

      /* Functional */
      --fp-positive: #00B050;
      --fp-negative: #C00000;
      --fp-caution: #FFC000;

      /* Typography */
      --fp-font: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--fp-font);
      background: var(--fp-white);
      color: var(--fp-navy);
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-radius: var(--border-radius-lg, 8px);
      overflow: hidden;
    }

    #root.fullscreen { border-radius: 0; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--fp-gray);
      font-size: 14px;
    }

    .error-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--fp-negative);
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">Loading dashboard...</div>
  </div>
  <script type="module" src="/src/dashboard-app.tsx"></script>
</body>
</html>
